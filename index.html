<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow System</title>

<!-- WhatsApp Preview -->
<meta property="og:title" content="Shadow System">
<meta property="og:description" content="Encrypted Interface • Access Restricted">
<meta property="og:image" content="https://talah20262-wq.github.io/EL.MAHFEY/hacker.webp">
<meta property="og:url" content="https://talah20262-wq.github.io/EL.MAHFEY/">
<meta property="og:type" content="website">

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
body{margin:0;background:black;color:#0ff;font-family:'Share Tech Mono',monospace;overflow:hidden}

/* VIDEO */
#intro{
position:fixed;width:100%;height:100%;object-fit:cover;z-index:9999;
}

/* MATRIX */
canvas{position:fixed;top:0;left:0;z-index:-1}

/* SCREEN */
.screen{display:none;text-align:center;padding:20px}
.active{display:block}

/* LOGO */
.logo{width:120px;border-radius:50%;box-shadow:0 0 40px #0ff}

/* EYE */
.eye{
width:80px;height:80px;border:3px solid #0ff;border-radius:50%;
margin:20px auto;position:relative;
}
.pupil{
width:20px;height:20px;background:#0ff;border-radius:50%;
position:absolute;top:30px;left:30px;
}

/* CHAT */
.chat{
width:80%;margin:auto;border:1px solid #0ff;padding:10px;
height:150px;overflow:auto;text-align:left;
}

/* CRACK */
.crack{
position:fixed;
width:100%;
height:100%;
background:url('https://i.imgur.com/6RMhx.gif') center/cover no-repeat;
display:none;
z-index:999;
}

/* BUTTON */
.btn{
margin-top:15px;padding:10px 20px;border:1px solid #0ff;
color:#0ff;text-decoration:none;display:inline-block;
}
.btn:hover{background:#0ff;color:#000}
</style>
</head>

<body>

<!-- VIDEO -->
<video id="intro" autoplay muted>
<source src="intro.mp4" type="video/mp4">
</video>

<!-- CRACK -->
<div class="crack" id="crack"></div>

<canvas id="matrix"></canvas>

<div id="main" class="screen">

<img src="hacker.webp" class="logo">

<div class="eye">
<div class="pupil" id="pupil"></div>
</div>

<div class="chat" id="chat"></div>

<a href="https://wa.me/201206561893?text=Hello%20I%20want%20more%20info" class="btn">
Contact
</a>

</div>

<script>

/* SOUND */
let glitchSound=new Audio("glitch.mp3");

/* VIDEO END */
setTimeout(()=>{
document.getElementById("intro").style.display="none";
document.getElementById("main").classList.add("active");
glitchSound.play();
startChat();
},4000);

/* MATRIX */
let c=document.getElementById("matrix");
let ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
let letters="01XYZ".split("");
let drops=Array(100).fill(1);

function draw(){
ctx.fillStyle="rgba(0,0,0,.05)";
ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle="#0ff";
drops.forEach((d,i)=>{
let t=letters[Math.floor(Math.random()*letters.length)];
ctx.fillText(t,i*10,d*10);
if(d*10>c.height)drops[i]=0;
drops[i]++;
});
}
setInterval(draw,33);

/* EYE TRACK */
document.addEventListener("mousemove",e=>{
let x=e.clientX/innerWidth*40;
let y=e.clientY/innerHeight*40;
pupil.style.transform=`translate(${x}px,${y}px)`;
});

/* FAKE AI CHAT */
let chat=document.getElementById("chat");
let msgs=[
"> System Online...",
"> Scanning user...",
"> Behavior analysis...",
"> You are being monitored..."
];

let i=0;
function startChat(){
if(i<msgs.length){
chat.innerHTML+=msgs[i]+"<br>";
i++;
setTimeout(startChat,1000);
}else{
setTimeout(crackScreen,1500);
}
}

/* CRACK */
function crackScreen(){
document.getElementById("crack").style.display="block";
setTimeout(()=>document.getElementById("crack").style.display="none",1500);
}

</script>

</body>
</html>
