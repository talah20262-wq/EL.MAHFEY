<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Network</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:black;
    color:#00ffcc;
    font-family:'Share Tech Mono', monospace;
    overflow:hidden;
}

/* LOADING */
#loader{
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
}
#loader img{
    width:200px;
    animation:pulse 1.5s infinite;
}
@keyframes pulse{
    50%{opacity:.4}
}

/* MATRIX */
canvas{position:fixed;top:0;left:0;z-index:-1}

/* SCREENS */
.screen{display:none;padding:20px}
.active{display:block}

/* LOGO */
.logo{
    width:130px;
    border-radius:50%;
    box-shadow:0 0 30px #0ff;
}

/* GLITCH */
.glitch{
    font-size:32px;
    position:relative;
}
.glitch::before,.glitch::after{
    content:attr(data-text);
    position:absolute;
    left:0;
}
.glitch::before{color:red;animation:g1 .3s infinite}
.glitch::after{color:blue;animation:g2 .3s infinite}
@keyframes g1{50%{transform:translate(2px,-2px)}}
@keyframes g2{50%{transform:translate(-2px,2px)}}

/* BUTTON */
.btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    border:1px solid #0ff;
    color:#0ff;
    text-decoration:none;
}
.btn:hover{
    background:#0ff;
    color:black;
}

/* DENIED */
.denied{
    color:red;
    font-size:40px;
    text-align:center;
    animation:shake .2s infinite;
}
@keyframes shake{
    50%{transform:translate(-3px,3px)}
}
</style>
</head>

<body>

<!-- LOADING بالصورة -->
<div id="loader">
    <img src="loading.png">
</div>

<canvas id="matrix"></canvas>

<div id="boot" class="screen active"></div>

<div id="profile" class="screen" style="text-align:center">
    <img src="hacker.webp" class="logo">

    <div class="glitch" data-text="DARK NETWORK">
        DARK NETWORK
    </div>

    <p>Encrypted System Interface</p>

    <a href="https://wa.me/201206561893" class="btn">CONTACT</a>
</div>

<div id="denied" class="screen denied">ACCESS DENIED</div>

<script>

/* SOUND */
function beep(f=600,d=100){
let ctx=new (window.AudioContext||window.webkitAudioContext)();
let o=ctx.createOscillator();
o.frequency.value=f;
o.connect(ctx.destination);
o.start();
setTimeout(()=>o.stop(),d);
}

/* MATRIX */
let c=document.getElementById("matrix");
let ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;

let letters="01XYZ".split("");
let drops=Array(100).fill(1);

function draw(){
ctx.fillStyle="rgba(0,0,0,.05)";
ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle="#0ff";

drops.forEach((d,i)=>{
let t=letters[Math.floor(Math.random()*letters.length)];
ctx.fillText(t,i*10,d*10);

if(d*10>c.height)drops[i]=0;
drops[i]++;
});
}
setInterval(draw,33);

/* SWITCH */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* LOADING */
setTimeout(()=>{
document.getElementById("loader").style.display="none";
startBoot();
},2500);

/* BOOT */
let lines=[
"Initializing system...",
"Connecting to dark nodes...",
"Decrypting layers...",
"Access attempt..."
];

let i=0;

function startBoot(){
if(i<lines.length){
document.getElementById("boot").innerHTML+=lines[i]+"<br>";
beep();
i++;
setTimeout(startBoot,700);
}else{
setTimeout(()=>{
show("profile");
},1000);
}
}

</script>

</body>
</html>
