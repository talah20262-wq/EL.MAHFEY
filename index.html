<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:black;
    color:#00ffcc;
    font-family:'Share Tech Mono', monospace;
    overflow:hidden;
}

/* MATRIX BACKGROUND */
canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

/* BOOT SCREEN */
#boot{
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    padding:20px;
    font-size:14px;
}

/* TERMINAL */
#terminal{
    display:none;
    padding:20px;
    white-space:pre-line;
}

.glow{
    text-shadow:0 0 10px #00ffcc,0 0 30px #00ffcc;
}

/* CARD */
.card{
    display:none;
    text-align:center;
    margin-top:50px;
}

.logo{
    width:130px;
    border-radius:50%;
    box-shadow:0 0 30px #00ffcc;
}

/* GLITCH TEXT */
.glitch{
    font-size:32px;
    position:relative;
    color:#00ffcc;
}

.glitch::before,
.glitch::after{
    content:attr(data-text);
    position:absolute;
    left:0;
}

.glitch::before{
    color:red;
    animation:gl1 0.5s infinite;
}

.glitch::after{
    color:blue;
    animation:gl2 0.5s infinite;
}

@keyframes gl1{
    0%{transform:translate(2px,-2px);}
    50%{transform:translate(-2px,2px);}
    100%{transform:translate(2px,-2px);}
}

@keyframes gl2{
    0%{transform:translate(-2px,2px);}
    50%{transform:translate(2px,-2px);}
    100%{transform:translate(-2px,2px);}
}

/* BUTTON */
.btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    border:1px solid #00ffcc;
    color:#00ffcc;
    text-decoration:none;
    transition:.3s;
}

.btn:hover{
    background:#00ffcc;
    color:black;
    box-shadow:0 0 20px #00ffcc;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="boot"></div>

<div id="terminal"></div>

<div class="card" id="profile">
    <img src="هكرز.webp" class="logo">

    <div class="glitch" data-text="محمد أحمد نجم">
        محمد أحمد نجم
    </div>

    <p>Digital Marketing | Creative Ads Specialist</p>

    <a href="https://wa.me/201206561893" class="btn">
        WhatsApp
    </a>
</div>

<script>

/* MATRIX EFFECT */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

let letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
letters = letters.split("");

let fontSize = 14;
let columns = canvas.width / fontSize;

let drops = [];
for(let i=0;i<columns;i++) drops[i]=1;

function draw(){
    ctx.fillStyle="rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00ffcc";
    ctx.font = fontSize+"px monospace";

    for(let i=0;i<drops.length;i++){
        let text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillText(text,i*fontSize,drops[i]*fontSize);

        if(drops[i]*fontSize>canvas.height && Math.random()>0.975)
            drops[i]=0;

        drops[i]++;
    }
}

setInterval(draw,33);

/* BOOT TEXT */
const bootText = [
"Initializing system...",
"Bypassing firewall...",
"Connecting to secure server...",
"Decrypting data...",
"Access granted ✔"
];

let i = 0;
let bootDiv = document.getElementById("boot");

function bootSequence(){
    if(i < bootText.length){
        bootDiv.innerHTML += bootText[i] + "\n";
        i++;
        setTimeout(bootSequence,800);
    }else{
        setTimeout(showTerminal,1000);
    }
}

bootSequence();

/* TERMINAL */
function showTerminal(){
    bootDiv.style.display="none";
    const terminal = document.getElementById("terminal");
    terminal.style.display="block";

    let text = ">> System Connected...\n>> Loading Profile...\n>> Welcome Mohamed...\n";
    let j=0;

    function type(){
        if(j < text.length){
            terminal.innerHTML += text.charAt(j);
            j++;
            setTimeout(type,30);
        }else{
            setTimeout(showProfile,1000);
        }
    }

    type();
}

/* SHOW PROFILE */
function showProfile(){
    document.getElementById("terminal").style.display="none";
    document.getElementById("profile").style.display="block";
}

</script>

</body>
</html>
