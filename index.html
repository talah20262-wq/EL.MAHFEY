<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TALLAH AI | Private Access</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
    body { margin: 0; background: black; color: #0ff; font-family: 'Share Tech Mono', 'Cairo', monospace; overflow: hidden; }

    /* شاشة التحقق من الروبوت */
    #verify-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #000; z-index: 10000; display: flex;
        flex-direction: column; justify-content: center; align-items: center;
        text-align: center;
    }
    .verify-box {
        border: 1px solid #0ff; padding: 30px; border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.2); background: rgba(10,10,10,0.9);
    }
    #captcha-code { font-size: 24px; letter-spacing: 10px; color: #fff; background: #222; padding: 10px; margin-bottom: 20px; user-select: none; }
    #captcha-input { background: #000; border: 1px solid #0ff; color: #fff; padding: 10px; text-align: center; font-size: 18px; outline: none; width: 150px; }
    .verify-btn { margin-top: 20px; padding: 10px 30px; border: 1px solid #0ff; color: #0ff; cursor: pointer; transition: 0.3s; }
    .verify-btn:hover { background: #0ff; color: #000; }

    /* فيديو الانترو */
    #intro { position: fixed; width: 100%; height: 100%; object-fit: cover; z-index: 9999; display: none; }

    /* الماتريكس */
    canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.4; }

    /* النظام الرئيسي */
    .screen { display: none; text-align: center; padding: 20px; }
    .active { display: block; animation: glitchOpen 1s ease; }

    .logo { width: 130px; border-radius: 50%; border: 2px solid #0ff; box-shadow: 0 0 40px #0ff; margin-top: 40px; }
    .brand { font-size: 32px; font-weight: 900; margin-top: 15px; text-shadow: 0 0 10px #0ff; }
    
    .eye { width: 80px; height: 80px; border: 2px solid #0ff; border-radius: 50%; margin: 20px auto; position: relative; }
    .pupil { width: 20px; height: 20px; background: #0ff; border-radius: 50%; position: absolute; top: 30px; left: 30px; box-shadow: 0 0 10px #0ff; }

    .chat {
        width: 85%; max-width: 500px; margin: auto; border: 1px solid rgba(0, 255, 255, 0.5);
        padding: 15px; height: 160px; overflow-y: auto; text-align: right; font-size: 14px;
        background: rgba(0,0,0,0.7); border-radius: 5px;
    }

    .btn { margin-top: 20px; padding: 12px 30px; border: 1px solid #0ff; color: #0ff; text-decoration: none; display: inline-block; font-weight: bold; }
    .btn:hover { background: #0ff; color: #000; }

    .crack { position: fixed; width: 100%; height: 100%; background: url('https://i.imgur.com/6RMhx.gif') center/cover no-repeat; display: none; z-index: 999; }

    @keyframes glitchOpen { 0% { opacity: 0; transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>

<!-- 1. شاشة التحقق -->
<div id="verify-screen">
    <div class="verify-box">
        <h3>بروتوكول التحقق من النظام</h3>
        <p style="font-size: 12px; color: #888;">أدخل الرمز لفك التشفير والدخول</p>
        <div id="captcha-code"></div>
        <input type="text" id="captcha-input" placeholder="ادخل الكود">
        <br>
        <button class="verify-btn" onclick="checkVerify()">التحقق والدخول</button>
    </div>
</div>

<!-- 2. فيديو الانترو -->
<video id="intro" muted>
    <source src="intro.mp4" type="video/mp4">
</video>

<!-- 3. الماتريكس -->
<canvas id="matrix"></canvas>

<!-- 4. شاشة النظام الرئيسي -->
<div id="main" class="screen">
    <div class="crack" id="crack"></div>
    <img src="hacker.webp" class="logo">
    <div class="brand">TALLAH <span style="color:#fff">AI</span></div>
    <div style="font-size: 10px; color: #d4af37;">Shadow Empire System</div>

    <div class="eye">
        <div class="pupil" id="pupil"></div>
    </div>

    <div class="chat" id="chat"></div>

    <a href="https://wa.me/201206561893" class="btn">Access TALLAH</a>
</div>

<script>
/* إنشاء كود كابتشا عشوائي */
let generatedCode = Math.random().toString(36).substring(2, 7).toUpperCase();
document.getElementById("captcha-code").innerText = generatedCode;

function checkVerify() {
    let input = document.getElementById("captcha-input").value.toUpperCase();
    if(input === generatedCode) {
        document.getElementById("verify-screen").style.display = "none";
        startSystem();
    } else {
        alert("فشل التحقق. أنت لست إمبراطوراً!");
        location.reload();
    }
}

function startSystem() {
    let intro = document.getElementById("intro");
    intro.style.display = "block";
    intro.play();
    
    setTimeout(() => {
        intro.style.display = "none";
        document.getElementById("main").classList.add("active");
        startChat();
    }, 4000);
}

/* الماتريكس */
let c = document.getElementById("matrix");
let ctx = c.getContext("2d");
c.width = innerWidth; c.height = innerHeight;
let letters = "TALLAH01".split("");
let drops = Array(Math.floor(c.width/10)).fill(1);

function draw() {
    ctx.fillStyle = "rgba(0,0,0,.05)";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#0ff";
    drops.forEach((d, i) => {
        let text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * 15, d * 15);
        if (d * 15 > c.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    });
}
setInterval(draw, 33);

/* تتبع العين */
document.addEventListener("mousemove", e => {
    let pupil = document.getElementById("pupil");
    let x = (e.clientX / innerWidth) * 40 - 20;
    let y = (e.clientY / innerHeight) * 40 - 20;
    pupil.style.transform = `translate(${x}px, ${y}px)`;
});

/* دردشة النظام */
let chat = document.getElementById("chat");
let msgs = [
    "> تم التحقق من الهوية البشرية..",
    "> جاري حقن البروتوكولات العصبية لـ طلة..",
    "> النظام الآن تحت سيطرة الإمبراطور..",
    "> تحذير: البيانات مشفرة بالكامل."
];
let i = 0;
function startChat() {
    if (i < msgs.length) {
        chat.innerHTML += msgs[i] + "<br>";
        chat.scrollTop = chat.scrollHeight;
        i++;
        setTimeout(startChat, 1500);
    }
}
</script>

</body>
</html>
